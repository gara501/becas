name: Revisar vigencia de presupuestos

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  vigencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Avisar si los precios superan 90 días
        run: python scripts/revisar_presupuestos.py --max-dias 90
